<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d4ea0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reg Reader">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Regulation Reader</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sticky-top">
    <header class="topbar">
      <div class="topbar-left">
        <select id="feed-picker" aria-label="Select regulation"></select>
      </div>
      <div class="topbar-right">
        <div class="lang-switch" role="group" aria-label="Language">
          <button id="lang-ja" class="lang-btn active" data-lang="ja">日本語</button>
          <button id="lang-en" class="lang-btn" data-lang="en">English</button>
        </div>
        <label class="toggle">
          <input type="checkbox" id="toggle-clauses" checked>
          <span id="cues-label">Cues</span>
        </label>
        <button id="text-smaller" title="Smaller text" aria-label="Smaller text">A-</button>
        <button id="text-larger" title="Larger text" aria-label="Larger text">A+</button>
        <button id="toggle-dark" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
      </div>
    </header>
    <div id="context-bar" class="context-bar">
      <button id="back-btn" class="back-link" hidden></button>
      <div id="legend" class="legend"></div>
    </div>
  </div>

  <!-- Not sticky: scrolls away with the page. Dismissal is remembered (see app.js). -->
  <div id="notice" class="notice" role="note" hidden>
    <p id="notice-text"></p>
    <button id="notice-close" type="button" class="notice-close">×</button>
  </div>

  <div class="layout">
    <nav id="toc" class="toc" aria-label="Table of contents"></nav>
    <main id="reader" class="reader" aria-live="polite"></main>
  </div>

  <footer id="source-line" class="source-line"></footer>

  <div id="ref-popover" class="ref-popover" hidden></div>

  <script>window.REG_STATIC_SITE = true;
if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function () {});</script>
  <script src="app.js"></script>
</body>
</html>
